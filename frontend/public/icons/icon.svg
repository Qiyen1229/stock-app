<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景深邃科技藍黑漸層 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- 金融科技折線漸層 (台灣股市紅金/科技金質感) -->
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="45%" stop-color="#60A5FA" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- 柔和漸層發光填充 -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0" />
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS 圓角連續曲線 (Continuous Corner) 背景底色 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- 科技幾何網格細線 (微弱背景) -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="80" y1="140" x2="432" y2="140" />
    <line x1="80" y1="230" x2="432" y2="230" />
    <line x1="80" y1="320" x2="432" y2="320" />
    <line x1="80" y1="410" x2="432" y2="410" />
  </g>

  <!-- 柱狀體背景感 (微弱金融感) -->
  <g opacity="0.15">
    <rect x="110" y="300" width="34" height="110" rx="8" fill="#3B82F6" />
    <rect x="175" y="250" width="34" height="160" rx="8" fill="#60A5FA" />
    <rect x="240" y="280" width="34" height="130" rx="8" fill="#3B82F6" />
    <rect x="305" y="190" width="34" height="220" rx="8" fill="#F59E0B" />
    <rect x="370" y="140" width="34" height="270" rx="8" fill="#EF4444" />
  </g>

  <!-- 面積漸層填充 -->
  <path d="M 85 360 
           C 140 340, 170 310, 205 315 
           C 240 320, 270 230, 310 240 
           C 350 250, 385 150, 425 125
           L 425 410 L 85 410 Z" 
        fill="url(#areaGrad)" />

  <!-- 主走勢折線 (流暢上升浪潮) -->
  <path d="M 85 360 
           C 140 340, 170 310, 205 315 
           C 240 320, 270 230, 310 240 
           C 350 250, 385 150, 425 125" 
        fill="none" 
        stroke="url(#lineGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- 關鍵轉折點光環 -->
  <circle cx="205" cy="315" r="7" fill="#60A5FA" />
  <circle cx="310" cy="240" r="7" fill="#F59E0B" />

  <!-- 頂部衝刺光點 (帶有能量光暈) -->
  <circle cx="425" cy="125" r="14" fill="#EF4444" filter="url(#glow)" />
  <circle cx="425" cy="125" r="6" fill="#FFFFFF" />

  <!-- 極簡優雅文字小標誌 TAIWAN STOCKS -->
  <text x="256" y="456" 
        fill="#94A3B8" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="4" 
        text-anchor="middle" 
        opacity="0.85">STOCK APP</text>
</svg>
